[project]
name = "monsieur-cuisine-mcp"
version = "0.1.0"
description = "Unofficial MCP server for integrating with Monsieur Cuisine (Lidl Monsieur Cuisine / LidlOMix)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    # Floor is 3.0 because that is the oldest release this has actually run on;
    # the previous ">=2.0.0" was never tested against.
    "fastmcp>=3.0",
    # Used directly by the recipe client. It used to arrive only as a transitive
    # dependency of fastmcp, which broke the moment fastmcp 4 switched to httpx2.
    "httpx>=0.28",
    "playwright>=1.45",
]

[project.scripts]
monsieur-cuisine-mcp = "monsieur_cuisine_mcp.server:main"
monsieur-cuisine-mcp-login = "monsieur_cuisine_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monsieur_cuisine_mcp"]
